name: Build APK & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compute version (VERSION file + run number)
        run: |
          echo "APP_VERSION=$(tr -d ' \r\n' < VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Point updater at this repo
        run: sed -i "s#__REPO__#${GITHUB_REPOSITORY}#" www/config.js

      - run: npm install
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align & sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ks.jks; PASS="$KS_PASS"; ALIAS="${KS_ALIAS:-hndpay}"
          else
            cp keystore/hndpay.jks ks.jks; PASS="hndpay-secret"; ALIAS="hndpay"
          fi
          UNS=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          "$BT/zipalign" -p -f 4 "$UNS" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out HnDPaY.apk aligned.apk
          "$BT/apksigner" verify HnDPaY.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: HnDPaY ${{ env.APP_VERSION }}
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          files: HnDPaY.apk
          make_latest: true
