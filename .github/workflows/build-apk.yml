name: Build APK & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip uploaded zip into the repo
        run: |
          set -e
          shopt -s nullglob
          FILES=(./*.zip)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No zip found - using repo files as they are"
            exit 0
          fi
          NAMES=""
          while IFS= read -r Z; do
            echo "Unzipping $Z"
            T=$(mktemp -d)
            unzip -q -o "$Z" -d "$T"
            rm -rf "$T/__MACOSX"
            P=$(find "$T" -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)
            if [ -n "$P" ]; then SRC=$(dirname "$P"); else SRC="$T"; fi
            rm -rf "$SRC/.git" "$SRC/.github"
            for d in www native scripts assets; do
              if [ -d "$SRC/$d" ]; then rm -rf "./$d"; fi
            done
            cp -a "$SRC"/. .
            rm -f "$Z"
            NAMES="$NAMES $(basename "$Z")"
          done < <(for Z in "${FILES[@]}"; do echo "$(git log -1 --format=%ct -- "$Z") $Z"; done | sort -n | cut -d' ' -f2-)
          git config user.name "unzip"
          git config user.email "unzip@users.noreply.github.com"
          git add -A
          git commit -m "Unzip:$NAMES" || echo "Nothing to commit"
          git push

  apk:
    name: apk
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check required files
        run: |
          for f in package.json capacitor.config.json VERSION www/index.html www/config.js scripts/patch-android.mjs keystore/hndpay.jks; do
            [ -f "$f" ] || { echo "MISSING FILE: $f"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compute version
        id: ver
        run: |
          V="$(tr -d ' \r\n' < VERSION).${GITHUB_RUN_NUMBER}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Point updater at this repo
        run: sed -i "s#__REPO__#${GITHUB_REPOSITORY}#" www/config.js

      - run: npm install
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align & sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ks.jks; PASS="$KS_PASS"; ALIAS="${KS_ALIAS:-hndpay}"
          else
            cp keystore/hndpay.jks ks.jks; PASS="hndpay-secret"; ALIAS="hndpay"
          fi
          UNS=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          "$BT/zipalign" -p -f 4 "$UNS" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out HnDPaY.apk aligned.apk
          "$BT/apksigner" verify HnDPaY.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HnDPaY-APK
          path: HnDPaY.apk

  ota:
    name: ota
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HnDPaY-APK

      - name: Publish release (app auto-update source)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          name: HnDPaY ${{ needs.apk.outputs.version }}
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          files: HnDPaY.apk
          make_latest: true
